<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドパドパガチャ!!!!</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#12001f;color:#fff;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;text-align:center;overflow-x:hidden;min-height:100vh}
h1{font-size:clamp(30px,9vw,60px);margin:14px 0 4px;background:linear-gradient(90deg,#f00,#fa0,#ff0,#0f0,#0ff,#f0f,#f00);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 1s linear infinite}
@keyframes rb{to{background-position:300%}}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}
.stats div{background:#2a0a44;border:2px solid #f0f;border-radius:12px;padding:6px 12px;font-weight:900}
.btns{display:flex;flex-direction:column;gap:14px;align-items:center;margin:18px}
button{font:inherit;font-weight:900;border:0;border-radius:999px;color:#fff;cursor:pointer;padding:16px 28px;font-size:24px;box-shadow:0 6px 0 #0006;animation:pulse .5s infinite alternate}
#b1{background:linear-gradient(#ff3b6b,#c20040);font-size:34px;padding:22px 40px}
#b10{background:linear-gradient(#ffb300,#e65100)}
.sm{animation:none;font-size:14px;padding:8px 16px;background:#444}
@keyframes pulse{to{transform:scale(1.07) rotate(-1deg)}}
#col{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-width:640px;margin:0 auto;padding:10px}
.it{background:#2a0a44;border:2px solid var(--c);border-radius:10px;padding:4px;font-size:11px}
.it b{display:block;font-size:28px}
.it.no{opacity:.25;filter:grayscale(1)}
#stage{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;overflow:hidden}
#stage.on{display:flex}
#big{font-size:clamp(36px,13vw,110px);font-weight:900;line-height:1.1;text-shadow:0 0 20px #fff,6px 6px 0 #f0a,-6px -6px 0 #0ff;padding:0 10px;z-index:3;min-height:2.4em;display:flex;align-items:center}
#cap{font-size:clamp(90px,30vw,220px);z-index:3;animation:shake .08s infinite}
@keyframes shake{0%{transform:translate(8px,-8px) rotate(-8deg)}50%{transform:translate(-8px,8px) rotate(8deg)}100%{transform:translate(8px,8px) rotate(-4deg)}}
#fx{position:absolute;inset:0;z-index:2;pointer-events:none}
#fl{position:absolute;inset:0;background:#fff;opacity:0;z-index:4;pointer-events:none}
#res{z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:700px;padding:0 10px}
.card{background:#000a;border:4px solid var(--c);border-radius:14px;padding:8px 10px;box-shadow:0 0 24px var(--c);animation:pop .5s backwards;min-width:84px}
.card b{display:block;font-size:42px}
.card i{font-style:normal;font-weight:900;color:var(--c)}
@keyframes pop{from{transform:scale(0) rotate(720deg)}}
.big1 .card{padding:20px 40px}.big1 .card b{font-size:110px}
#close{z-index:6;margin-top:16px;display:none;animation:none;background:#fff;color:#000;font-size:20px}
.sk{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:7;animation:none;background:#333;font-size:12px;padding:6px 12px}
.rn{position:absolute;top:-80px;z-index:3;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.ring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:12px solid;border-radius:50%;z-index:3;pointer-events:none;animation:rg .8s ease-out forwards}@keyframes rg{to{transform:scale(60);opacity:0}}
.wd{position:absolute;z-index:3;font-weight:900;pointer-events:none;text-shadow:3px 3px 0 #000;animation:wd 1.3s ease-out forwards}@keyframes wd{0%{transform:scale(0) rotate(-20deg)}30%{transform:scale(1.7) rotate(10deg)}100%{transform:scale(1) translateY(-60px);opacity:0}}
.band{position:absolute;top:35%;left:0;white-space:nowrap;font-size:90px;font-weight:900;z-index:1;opacity:.5;animation:sl 1s linear infinite}@keyframes sl{from{transform:translateX(100vw)}to{transform:translateX(-200vw)}}
.gauge{position:absolute;bottom:12%;width:80%;height:30px;border:4px solid #fff;border-radius:20px;z-index:6;overflow:hidden}.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0a,#fd0)}
.rbw{animation:hue .8s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.tg{position:absolute;z-index:6;font-size:64px;cursor:pointer;animation:tg .25s infinite alternate}@keyframes tg{to{transform:scale(1.3) rotate(15deg)}}
.ch{display:flex;gap:20px;z-index:6;font-size:80px}.ch div{cursor:pointer;animation:tg .25s infinite alternate}
body{animation:bgc 2s linear infinite}@keyframes bgc{50%{background:#33003a}}
h1{display:inline-block;animation:rb 1s linear infinite,hs .3s infinite alternate}@keyframes hs{to{transform:rotate(2deg) scale(1.05)}}
#slot{border:6px solid gold;border-radius:20px;margin:10px auto;padding:10px;max-width:420px;background:#300;animation:neon .4s infinite alternate}@keyframes neon{to{box-shadow:0 0 40px #f0a,inset 0 0 30px #f0a}}
#rls{display:flex;gap:6px;justify-content:center}.rl{background:#fff;color:#000;border-radius:10px;width:92px;font-size:46px;line-height:1.25;border:4px solid #888}.rl.sp{filter:blur(1.2px)}.rl .a{background:#ffe27a}
#gg{font-size:30px;font-weight:900;color:#555;margin:6px}#gg.on{color:#f00;text-shadow:0 0 24px #f00;animation:pulse .15s infinite alternate}
.st{margin:8px 6px;background:#e00}.bt.on,#gt button.on{background:#f0a}#spin{font-size:26px;padding:14px 30px;background:linear-gradient(#0c0,#060);margin-top:8px}
#gt button{margin:4px;font-size:15px;padding:10px 14px;animation:none;background:#444}
:root{--rw:min(26vw,140px)}
.rl,.st{box-sizing:border-box;width:var(--rw)}.rl{font-size:min(9vw,58px)}.st{margin:8px 3px;font-size:22px;padding:18px 0}
.st.nav{background:#fd0;color:#000;animation:pulse .2s infinite alternate}
.rl .w{animation:bl .1s infinite alternate}@keyframes bl{to{background:#f0a;transform:scale(1.15)}}
#main{display:grid;grid-template-columns:1fr;gap:10px;max-width:1200px;margin:0 auto;padding:0 8px}
@media(orientation:landscape) and (min-width:700px){:root{--rw:min(14vw,150px)}.rl{font-size:min(8vh,64px)}#main{grid-template-columns:1.2fr 1fr;align-items:start}h1{font-size:34px;margin:4px}.stats{margin:4px}.btns{flex-direction:row;flex-wrap:wrap;justify-content:center;margin:8px}#b1{font-size:24px;padding:16px 24px}#b10{font-size:20px}#slot{max-width:none}}
#res{z-index:10}#close{z-index:11}
</style></head><body>
<h1>ドパドパガチャ!!!!</h1>
<div>ひく たびに ぜんぶ うるさい!!</div>

<script>
const R=[
{n:"N",w:50,c:"#9ab",pt:1,it:[["🪨","ただの石"],["🥔","じゃがいも"],["🧦","片方の靴下"],["🍙","おにぎり"],["📎","クリップ"]]},

{n:"SR",w:14,c:"#c6f",pt:20,it:[["🐉","ドラゴン"],["💎","ダイヤ"],["🦄","ユニコーン"]]},
{n:"SSR",w:5,c:"#fd0",pt:100,it:[["👑","王冠"],["🚀","ロケット"],["🌈","にじ"]]},
{n:"UR",w:1,c:"#f0a",pt:1000,it:[["🪐","わく星"],["☄️","すい星"],["🌌","ぎんが"]]}];
const $=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms));
let cnt=0,dop=0,pity=0,mute=false,skip=false,busy=false,got={};
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function tone(f,d=.1,t="square",v=.15){if(mute)return;try{ac=ac||new AC();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function noise(d=.5){if(mute)return;try{ac=ac||new AC();const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=.4;s.buffer=b;s.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const fan=(base,n=6)=>{for(let i=0;i<n;i++)setTimeout(()=>tone(base*Math.pow(1.26,i),.12,"square"),i*60)};
const big=$("big"),cap=$("cap"),st=$("stage"),fl=$("fl"),res=$("res"),cv=$("fx"),cx=cv.getContext("2d");
function flash(c="#fff"){fl.style.background=c;fl.style.transition="none";fl.style.opacity=1;requestAnimationFrame(()=>{fl.style.transition="opacity .25s";fl.style.opacity=0})}
function say(t,c){big.textContent=t;big.style.color=c||"#fff";big.animate([{transform:"scale(2.4) rotate(-6deg)"},{transform:"scale(1) rotate(0)"}],{duration:200,easing:"ease-out"})}
function bg(c){st.style.background=c}
const rc=()=>`hsl(${Math.random()*360|0} 100% 50%)`;
function quake(ms=300){st.animate([{transform:"translate(14px,-14px)"},{transform:"translate(-14px,14px)"},{transform:"translate(10px,10px)"},{transform:"none"}],{duration:ms,iterations:2})}
let P=[];
function boom(n,cols){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=4+Math.random()*16;P.push({x:cv.width/2,y:cv.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,l:80+Math.random()*60,c:cols?cols[Math.random()*cols.length|0]:rc(),s:5+Math.random()*9})}}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}requestAnimationFrame(loop)})();
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener("resize",rs);
function roll(){let x=Math.random()*100,i=0;for(;i<5;i++){x-=GW[i];if(x<0)break}return Math.min(i,4)}
function draw(){pity++;let r=roll();if(pity>=30&&r<3)r=3;if(r>=3)pity=0;const it=R[r].it[Math.random()*R[r].it.length|0];return{r,e:it[0],nm:it[1]}}
const W=async ms=>{if(!skip)await sl(ms)};
let last=-1;
const rainE=(a,n,d=1.5,p)=>{for(let i=0;i<n;i++){const s=document.createElement("span");s.className="rn";s.textContent=a[Math.random()*a.length|0];s.style.cssText=`left:${Math.random()*100}vw;font-size:${30+Math.random()*60}px;animation-duration:${d*(.6+Math.random())}s;animation-delay:${Math.random()*.5}s`;(p||st).appendChild(s);if(p){s.style.position='fixed';s.style.zIndex=70}setTimeout(()=>s.remove(),(d*1.6+.6)*1000)}};
const ring=c=>{const r=document.createElement("div");r.className="ring";r.style.borderColor=c;st.appendChild(r);setTimeout(()=>r.remove(),850)};
function bass(){if(mute)return;try{ac=ac||new AC();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(30,t+.5);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.6)}catch(e){}}
const hit=c=>{bass();noise(.3);flash(c);quake(250);ring(c);boom(40);vib(100)};
async function pRoulette(b){cap.textContent="🎰";let d=40;for(let i=0;i<30;i++){const k=i<27?Math.random()*5|0:(b>=3?b:2);say(R[k].n,R[k].c);bg(R[k].c);tone(300+k*120,.05);await W(d);d*=1.11}hit("#fff");say("止まった…!!");await W(800)}
async function pDrum(){cap.textContent="🥁";const t=["ドン","ドン!!","ドドン!!!","ドドドン!!!!","ドパァァァァ!!!!!"];for(let i=0;i<5;i++){say(t[i]);big.style.fontSize=(50+i*22)+"px";cap.style.fontSize=(100+i*50)+"px";hit(rc());bg(rc());await W(i<4?550-i*80:900)}big.style.fontSize="";cap.style.fontSize=""}
async function pBug(){cap.textContent="💾";const t=["ERROR","E̷R̷R̷O̷R̷","ガ チ ャ が 壊 れ た","やばいやばい","システム暴走!!!","404 ドーパミン"];for(let i=0;i<12;i++){say(t[i%6],i%2?"#f00":"#0f0");st.style.filter=i%2?"invert(1)":"hue-rotate("+i*60+"deg)";bg(i%2?"#000":rc());noise(.15);tone(100+Math.random()*900,.1,"sawtooth");vib(30);quake(100);await W(170)}st.style.filter="";say("…なおった!","#0ff");bg("#000");await W(900)}
async function pTap(){cap.textContent="🔨";let n=0;const need=12,g=document.createElement("div");g.className="gauge";g.innerHTML="<i></i>";st.appendChild(g);const h=()=>{n++;g.firstChild.style.width=Math.min(100,n/need*100)+"%";tone(300+n*60,.06);hit(rc());say("連打!! "+n)};st.addEventListener("pointerdown",h);say("連打しろォォォ!!!","#ff0");const t0=Date.now();while(n<need&&Date.now()-t0<4500&&!skip)await sl(100);st.removeEventListener("pointerdown",h);g.remove();say("MAX!!!!!","#f0a");hit("#f0a");await W(800)}
async function pDrop(){cap.textContent="☄️";cap.style.animation="none";cap.animate([{transform:"translateY(-120vh) scale(.3)"},{transform:"translateY(0) scale(1.5)"}],{duration:1800,easing:"ease-in"});say("なにかが落ちてくる!!!","#fa0");rainE(["☄️","🔥","⭐"],25,1);for(let i=0;i<9;i++){tone(1200-i*100,.15,"sawtooth",.1);await W(200)}hit("#fa0");rainE(["💥"],10,.8);cap.style.animation="";hit("#fff");say("ドッカァァァン!!!","#f55");await W(900)}
async function pCut(){cap.textContent="😱";const b=document.createElement("div");b.className="band";b.textContent="超激アツ超激アツ超激アツ超激アツ";st.appendChild(b);const t=["激アツ!!","チャンス!!","来た来た来た","ヤバい!!","確定か!?","うおおお!!!"],e=["😱","👹","🤯","🔥","💀","😈"];for(let i=0;i<6;i++){bg(i%2?"#c00":"#fd0");b.style.color=i%2?"#fd0":"#c00";cap.textContent=e[i];hit(i%2?"#f00":"#ff0");say(t[i]);await W(420)}b.remove()}
let chaosT;
let coins=1000000,GW=[50,30,14,5,1],gi=0,bi=0,sp=[0,0,0],run3=[0,0,0],spinning=false,tgt=null,gogo=false,tm,autoT,tr=1;
try{const s=JSON.parse(localStorage.getItem('dpg'));if(s){coins=s.coins;dop=s.dop;cnt=s.cnt;got=s.got}}catch(e){}
const save=()=>{try{localStorage.setItem('dpg',JSON.stringify({coins,dop,cnt,got}))}catch(e){}};
R[0].it.push(['🧻','トイレットペーパー'],['🥫','缶詰'],['🪴','しなびた草'],['🧽','スポンジ'],['🍞','食パンの耳'],['👟','片方のくつ']);
R[1].it.push(['🍔','ハンバーガー'],['🎧','ヘッドホン'],['🐼','パンダ'],['🛹','スケボー'],['🍰','ケーキ'],['📱','スマホ']);
R[2].it.push(['🐲','ゴールドドラゴン'],['🏎️','スポーツカー'],['🧙','大魔法使い'],['🥇','金メダル'],['🦖','ティラノ']);
R[3].it.push(['🛸','UFO'],['🏰','お城'],['🪙','伝説のコイン'],['🔱','神の槍'],['🎆','花火大会']);
R[4].it.push(['🕳️','ブラックホール'],['⏳','時間そのもの'],['👾','ゲームの神'],['🌠','宇宙の始まり']);
const GT=[{n:'ノーマル',p:500000,w:[50,30,14,5,1]},{n:'激アツ',p:5000000,w:[20,30,30,15,5]},{n:'超ドパ',p:77777777,w:[0,10,40,40,10]},{n:'神',p:1000000000,w:[0,0,0,60,40]}];
const fmt=n=>n>=1e8?Math.floor(n/1e7)/10+'億':n>=1e4?Math.floor(n/1e3)/10+'万':n.toLocaleString();
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:30%;left:50%;transform:translateX(-50%);background:#e00;padding:16px 24px;border-radius:12px;font-weight:900;font-size:22px;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const SY=['7️⃣','🍒','🍋','🔔','🍉','💎','🍒','⭐','🍋','7️⃣','🔔','🍉','🍒','🍋'],L=14,LW=['🍒','🍒','🍒','🍋','🍋','🍉','🍉','🔔','⭐','💎','7️⃣','7️⃣'];
const PAY={'🍒':100000,'🍋':300000,'🍉':1000000,'🔔':5000000,'⭐':20000000,'💎':100000000,'7️⃣':777777777},ROWS=[[1],[0,1],[0,1,2]],BET=[0,10000,99999];
document.querySelector('.stats').insertAdjacentHTML('beforeend','<div>🪙 <span id="co"></span></div>');
document.querySelector('.btns').insertAdjacentHTML('beforebegin',`<h2>🎰 ドパスロット</h2><div id='slot'><div id='gg'>GO!GO!</div><div id='rls'>${[0,1,2].map(i=>`<div class='rl' id='r${i}'></div>`).join('')}</div><div>${[0,1,2].map(i=>`<button class='sm st' data-i='${i}'>停止</button>`).join('')}</div><div>${['1段 無料','2段 10,000','3段 99,999'].map((t,i)=>`<button class='sm bt${i?'':' on'}' data-i='${i}'>${t}</button>`).join('')}</div><button id='spin'>🎰 レバーON!!</button></div><h2>🎁 ガチャえらぶ</h2><div id='gt'></div>`);
function rend(){for(let i=0;i<3;i++)$('r'+i).innerHTML=[-1,0,1].map((o,k)=>`<div class='${ROWS[bi].includes(k)?'a':''}'>${SY[(sp[i]+o+L*2)%L]}</div>`).join('')}
function sel(i){gi=i;GW=GT[i].w;$('gt').innerHTML='';GT.forEach((g,k)=>{const b=document.createElement('button');b.textContent=g.n+' '+fmt(g.p);b.className=k==i?'on':'';b.onclick=()=>sel(k);$('gt').appendChild(b)});$('b1').textContent='🎰 '+GT[i].n+'ガチャ!!! '+fmt(GT[i].p);$('b10').textContent='🔥 10連 '+fmt(GT[i].p*9)}
async function slSilence(){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000;z-index:60';document.body.appendChild(d);const m=mute;mute=true;await sl(2600);mute=m;d.remove();bass();noise(.8)}
async function pSilence(){gPause=1;clearInterval(chaosT);st.querySelectorAll('.rn,.wd,.gc').forEach(e=>e.remove());st.style.transform='';P=[];bg('#000');big.textContent='';cap.style.display='none';const m=mute;mute=true;await W(2800);mute=m;tone(1800,.05,'sine',.3);big.style.color='#fff';big.textContent='…';await W(1300);gPause=0}
async function spin(){
if(busy||spinning)return;const c=BET[bi];if(coins<c){toast('コインが足りない!!');tone(100,.3,'sawtooth',.3);return}
coins-=c;upd();spinning=true;run3=[true,true,true];tgt=null;gogo=false;spd=[0,0,0].map(()=>.45+Math.random()*1.3);dr=[1,Math.random()<.5?-1:1,1];sp=sp.map(()=>Math.random()*L|0);startFx();
